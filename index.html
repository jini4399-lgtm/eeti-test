const LABELS = ['전혀 아니다','아니다','보통이다','그렇다','매우 그렇다'];
const ANS = [];
for (var i = 0; i < 32; i++) ANS.push(null);

var idx = 0;
var last = null;
var autoAdvanceLock = false;

function $(id) {
  return document.getElementById(id);
}

function avg(arr) {
  var sum = 0;
  for (var i = 0; i < arr.length; i++) sum += arr[i];
  return sum / arr.length;
}

function digit(a, b) {
  if (a >= 3.5 && b >= 3.5) return '4';
  if (a >= 3.5 && b < 3.5) return '3';
  if (a < 3.5 && b >= 3.5) return '2';
  return '1';
}

function renderList(id, arr) {
  var el = $(id);
  if (!el) return;
  el.innerHTML = '';
  for (var i = 0; i < arr.length; i++) {
    var li = document.createElement('li');
    li.textContent = arr[i];
    el.appendChild(li);
  }
}

function synth(engine, drive, code) {
  var detail = DETAIL_RESULTS[code];

  if (detail && detail.fitDeep) {
    return {
      header: detail.header,
      summary: engine[0] + ' 엔진이 ' + drive[0] + ' 방식으로 현실에서 발현되는 구조입니다. ' + engine[1] + ' ' + drive[1],
      fit: detail.fitDeep,
      conflict: detail.conflictDeep,
      improve: detail.improveDeep,
      strength: detail.strengthDeep,
      engineDeep: detail.engineDeep,
      driveDeep: detail.driveDeep
    };
  }

  return {
    header: code + ' ' + engine[0] + ', ' + drive[0],
    summary: engine[0] + ' 엔진이 ' + drive[0] + ' 방식으로 현실에서 발현되는 구조입니다. ' + engine[1] + ' ' + drive[1],
    fit: [
      engine[0] + '의 핵심 에너지가 ' + drive[0] + ' 방식과 만나 현재 삶의 결을 만듭니다.',
      engine[0] + '의 장점은 ' + engine[2].slice(0,2).join(', ') + ' 쪽에서 나타날 가능성이 큽니다.',
      '운전방식은 ' + drive[1] + '의 결을 띠며, 현실에서는 ' + drive[2].slice(0,2).join(', ') + ' 문제가 그림자로 생길 수 있습니다.'
    ],
    conflict: [
      '이 조합은 ' + engine[0] + ' 엔진과 ' + drive[0] + ' 방식의 마찰이 삶에서 반복 주제로 나타날 수 있습니다.',
      '장점이 강할수록 같은 방향의 그림자도 함께 커질 수 있습니다.',
      '과로, 과공감, 과독주, 과정지 중 무엇이 반복되는지 점검해보세요.'
    ],
    improve: [
      engine[3][0] + '를 생활 루틴으로 설계하기',
      engine[3][1] + '를 생활 루틴으로 설계하기',
      drive[2][0] + '를 조기에 감지하고 수정하기',
      drive[2][1] + '를 조기에 감지하고 수정하기'
    ],
    strength: [
      engine[2][0] + '을(를) 강점 자산으로 키우기',
      engine[2][1] + '을(를) 강점 자산으로 키우기',
      engine[2][2] + '을(를) 강점 자산으로 키우기',
      drive[0] + ' 특유의 작동 방식을 전문성으로 번역하기'
    ],
    engineDeep: engine[1],
    driveDeep: drive[1]
  };
}

function render() {
  var q = QUESTIONS[idx];
  if (!q) return;

  $('qAxis').textContent = q[0];
  $('qText').textContent = q[1];
  $('pLabel').textContent = '문항 ' + (idx + 1) + ' / 32';

  var pct = Math.round(((idx + 1) / 32) * 100);
  $('pPct').textContent = pct + '%';
  $('pFill').style.width = pct + '%';

  var opts = $('opts');
  opts.innerHTML = '';

  for (var i = 0; i < LABELS.length; i++) {
    (function(iCopy){
      var value = iCopy + 1;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'opt' + (ANS[idx] === value ? ' active' : '');
      btn.innerHTML = '<span class="num">' + value + '</span><span class="txt">' + LABELS[iCopy] + '</span>';

      btn.addEventListener('click', function() {
        if (autoAdvanceLock) return;
        ANS[idx] = value;
        render();

        autoAdvanceLock = true;
        setTimeout(function() {
          autoAdvanceLock = false;
          if (idx < 31) {
            idx += 1;
            render();
          } else {
            showResult();
          }
        }, 120);
      });

      opts.appendChild(btn);
    })(i);
  }

  $('prev').disabled = idx === 0;
  $('next').disabled = ANS[idx] == null;
  $('next').textContent = idx === 31 ? '결과 보기' : '다음';
}

function startTest() {
  $('landing').classList.add('hidden');
  $('about').classList.add('hidden');
  $('test').classList.remove('hidden');
  $('result').classList.add('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  render();
}

function resetTest() {
  for (var i = 0; i < ANS.length; i++) ANS[i] = null;
  idx = 0;
  last = null;
  $('result').classList.add('hidden');
  $('test').classList.remove('hidden');
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function prevQ() {
  if (idx > 0) {
    idx -= 1;
    render();
  }
}

function nextQ() {
  if (ANS[idx] == null) return;
  if (idx < 31) {
    idx += 1;
    render();
  } else {
    showResult();
  }
}

function fillFallbackDetail() {
  var temp = '이 조합의 상세 결과는 아직 준비 중입니다.';
  $('identity').textContent = temp;
  $('summaryDetail').textContent = '현재는 대표 엔진과 공감 방식 중심의 결과가 제공됩니다. 같은 형식으로 나머지 엔진군을 계속 확장하면 됩니다.';
  $('relationship').textContent = temp;
  $('romance').textContent = temp;
  $('work').textContent = temp;
  $('money').textContent = temp;
  $('health').textContent = temp;
  $('ages').textContent = temp;
  $('society').textContent = temp;
  $('maximize').textContent = temp;
  $('minimize').textContent = temp;
  $('finalAdvice').textContent = '지금은 엔진과 공감 방식의 결만 먼저 보시고, 이후 세부 리포트를 계속 확장하면 됩니다.';
  $('authHint').textContent = temp;
}

function showResult() {
  var groups = {
    will:[], response:[],
    reason:[], empathy:[],
    output:[], adapt:[],
    learn:[], evolve:[]
  };

  for (var i = 0; i < QUESTIONS.length; i++) {
    var q = QUESTIONS[i];
    var v = ANS[i];
    if (q[3]) v = 6 - v;
    groups[q[2]].push(v);
  }

  var a1 = digit(avg(groups.will), avg(groups.response));
  var a2 = digit(avg(groups.reason), avg(groups.empathy));
  var a3 = digit(avg(groups.output), avg(groups.adapt));
  var a4 = digit(avg(groups.learn), avg(groups.evolve));

  var code = '' + a1 + a2 + a3 + a4;
  var engineData = ENGINE[Number('' + a1 + a2)];
  var driveData = DRIVE[Number('' + a3 + a4)];
  var detail = DETAIL_RESULTS[code];
  var mixed = synth(engineData, driveData, code);

  $('rHeader').textContent = mixed.header;
  $('rSummary').textContent = mixed.summary;
  $('engine').textContent = mixed.engineDeep;
  $('drive').textContent = mixed.driveDeep;

  renderList('fit', mixed.fit);
  renderList('conflict', mixed.conflict);
  renderList('improve', mixed.improve);
  renderList('strength', mixed.strength);

  if (detail) {
    $('identity').textContent = detail.identity || '';
    $('summaryDetail').textContent = detail.summary || '';
    $('relationship').textContent = detail.relationship || '';
    $('romance').textContent = detail.romance || '';
    $('work').textContent = detail.work || '';
    $('money').textContent = detail.money || '';
    $('health').textContent = detail.health || '';
    $('ages').textContent = detail.ages || '';
    $('society').textContent = detail.society || '';
    $('maximize').textContent = detail.maximize || '';
    $('minimize').textContent = detail.minimize || '';
    $('finalAdvice').textContent = detail.finalAdvice || '';
    $('authHint').textContent = detail.authHint || '';
  } else {
    fillFallbackDetail();
  }

  last = {
    code: code,
    header: $('rHeader').textContent,
    summary: $('rSummary').textContent
  };

  $('test').classList.add('hidden');
  $('result').classList.remove('hidden');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function copyResult() {
  if (!last) return;
  var text = 'EETI 결과\n' + last.header + '\n요약: ' + last.summary;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text)
      .then(function () {
        alert('결과가 복사되었습니다.');
      })
      .catch(function () {
        alert('복사에 실패했습니다.');
      });
  } else {
    alert('이 환경에서는 복사를 지원하지 않습니다.');
  }
}

function updateVisitorCount() {
  var el = $('visitorCount');
  if (!el) return;

  try {
    var key = 'eeti_local_visits';
    var next = (parseInt(localStorage.getItem(key) || '0', 10) || 0) + 1;
    localStorage.setItem(key, String(next));
    el.textContent = Number(next).toLocaleString('ko-KR');
  } catch (e) {
    el.textContent = '1';
  }
}

function googleTranslateElementInit() {
  try {
    if (!window.google || !google.translate || !google.translate.TranslateElement) return;
    new google.translate.TranslateElement(
      {
        pageLanguage: 'ko',
        includedLanguages: 'en,ja,zh-CN,es',
        autoDisplay: false,
        layout: google.translate.TranslateElement.InlineLayout.SIMPLE
      },
      'google_translate_element'
    );
  } catch (e) {
    console.error('Google Translate init error:', e);
  }
}

function bindEvents() {
  var startBtn = $('startBtn');
  var aboutBtn = $('aboutBtn');
  var prevBtn = $('prev');
  var nextBtn = $('next');
  var resetBtn = $('resetBtn');
  var copyBtn = $('copyBtn');

  if (startBtn) startBtn.addEventListener('click', startTest);
  if (aboutBtn) {
    aboutBtn.addEventListener('click', function () {
      $('about').scrollIntoView({ behavior: 'smooth' });
    });
  }
  if (prevBtn) prevBtn.addEventListener('click', prevQ);
  if (nextBtn) nextBtn.addEventListener('click', nextQ);
  if (resetBtn) resetBtn.addEventListener('click', resetTest);
  if (copyBtn) copyBtn.addEventListener('click', copyResult);
}

function initApp() {
  bindEvents();
  updateVisitorCount();
}

window.googleTranslateElementInit = googleTranslateElementInit;
document.addEventListener('DOMContentLoaded', initApp);
</script>
