<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 공감 유형</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --abyss:#0A1820; --deep:#0E2531; --panel:rgba(255,255,255,.045); --panel-2:rgba(255,255,255,.07);
    --paper:#EEE6D6; --soft:rgba(238,230,214,.74); --faint:rgba(238,230,214,.48);
    --gold:#E3A53E; --goldB:#F6CB72; --goldD:#C2832A; --teal:#6FB3A8;
    --line:rgba(238,230,214,.13); --line-2:rgba(238,230,214,.22);
    --glow:rgba(227,165,62,.22);
    --radius:14px; --maxw:680px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    color:var(--paper);
    font-family:"Noto Sans KR",system-ui,sans-serif;font-weight:400;line-height:1.7;letter-spacing:-.01em;
    -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden;position:relative;
    background:
      radial-gradient(1100px 700px at 50% -8%, rgba(227,165,62,.20), transparent 60%),
      radial-gradient(900px 600px at 12% 30%, rgba(111,179,168,.12), transparent 55%),
      radial-gradient(1000px 800px at 88% 75%, rgba(111,179,168,.10), transparent 55%),
      linear-gradient(165deg,#0A1820 0%, #0E2733 50%, #091017 100%);
    background-attachment:fixed;
  }
  .serif{font-family:"Gowun Batang",serif}
  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 22px}

  header{position:sticky;top:0;z-index:40;background:rgba(10,24,32,.72);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  .nav{max-width:var(--maxw);margin:0 auto;padding:14px 22px;display:flex;align-items:center;justify-content:space-between}
  .brand{font-family:"Gowun Batang",serif;font-size:17px;font-weight:700;cursor:pointer;color:var(--paper)}
  .brand span{color:var(--goldB)}
  .tabs{display:flex;gap:4px}
  .tab{font-size:14px;color:var(--soft);background:none;border:none;cursor:pointer;padding:7px 14px;border-radius:999px;font-family:inherit;transition:.2s}
  .tab:hover{color:var(--paper)}
  .tab.active{background:var(--gold);color:#0A1820;font-weight:500}

  .visitorbar{text-align:center;padding:9px 22px;background:rgba(10,24,32,.5);border-bottom:1px solid var(--line);font-size:12.5px;color:var(--soft)}
  .visitorbar b{color:var(--goldB);font-weight:700;font-variant-numeric:tabular-nums}

  main{padding-bottom:90px}
  .view{display:none}
  .view.active{display:block;animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
